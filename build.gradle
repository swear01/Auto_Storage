def compatModuleFiles = fileTree('src/compat') {
    include '*/compat-module.json'
}.files.sort { left, right -> left.path <=> right.path }

if (compatModuleFiles.isEmpty()) {
    throw new GradleException('No compatibility module descriptors found')
}

def expandCompatDependency = { String notation ->
    notation.replaceAll(/\$\{([^}]+)\}/) { ignored, propertyName ->
        if (!project.hasProperty(propertyName)) {
            throw new GradleException(
                    "Unknown compatibility dependency property: ${propertyName}")
        }
        project.property(propertyName).toString()
    }
}

def isSafeExactZipEntry = { value ->
    value instanceof String
            && !value.isEmpty()
            && !value.startsWith('/')
            && !value.endsWith('/')
            && !value.contains('\\')
            && !value.contains('*')
            && !value.contains('?')
            && !value.contains('[')
            && !value.contains(']')
            && !value.any { character ->
                int code = character.charAt(0)
                code < 32 || code == 127
            }
            && !value.split('/', -1).any { it in ['', '.', '..'] }
}

def compatModules = compatModuleFiles.collect { descriptorFile ->
    def descriptor = new JsonSlurper().parse(descriptorFile)
    def directoryId = descriptorFile.parentFile.name
    def auditArtifact = descriptor.auditArtifact
    def descriptorRepositories = descriptor.repositories == null ? [] : descriptor.repositories
    def descriptorRuntimeTransforms = descriptor.runtimeArtifactTransforms == null
            ? []
            : descriptor.runtimeArtifactTransforms
    if (descriptor.schema != 1
            || descriptor.id != "auto_storage:${directoryId}"
            || !(descriptor.entrypoint instanceof String)
            || !(descriptor.requires instanceof List) || descriptor.requires.isEmpty()
            || descriptor.side != 'both'
            || !(descriptor.sourceSet instanceof String)
            || !(descriptor.fixture instanceof String)
            || !(descriptor.expectedTests instanceof Integer)
            || descriptor.expectedTests <= 0
            || !(descriptor.dependencies instanceof List)
            || descriptor.dependencies.isEmpty()
            || !(descriptorRepositories instanceof List)
            || descriptorRepositories.any {
                !(it instanceof String) || !(it ==~ /https:\/\/\S+/)
            }
            || descriptorRepositories.toSet().size() != descriptorRepositories.size()
            || !(descriptor.runtimeDependencies instanceof List)
            || descriptor.runtimeDependencies.isEmpty()
            || descriptor.runtimeDependencies.toSet().size()
            != descriptor.runtimeDependencies.size()
            || !descriptor.runtimeDependencies.contains(descriptor.dependencies[0])
            || !(descriptorRuntimeTransforms instanceof List)
            || descriptorRuntimeTransforms.any { transform ->
                !(transform instanceof Map)
                        || transform.keySet()
                        != ['dependency', 'sha256', 'remove_entries'] as Set
                        || !(transform.dependency instanceof String)
                        || !(transform.dependency
                        ==~ /[^:\s]+:[^:\s]+:[^:\s]+/)
                        || !(transform.sha256 instanceof String)
                        || !(transform.sha256 ==~ /[0-9a-f]{64}/)
                        || !(transform.remove_entries instanceof List)
                        || transform.remove_entries.isEmpty()
                        || transform.remove_entries.toSet().size()
                        != transform.remove_entries.size()
                        || !transform.remove_entries.every(isSafeExactZipEntry)
                        || !descriptor.runtimeDependencies.contains(
                        transform.dependency)
            }
            || descriptorRuntimeTransforms.collect { it.dependency }.toSet().size()
            != descriptorRuntimeTransforms.size()
            || descriptorRuntimeTransforms.collect { it.sha256 }.toSet().size()
            != descriptorRuntimeTransforms.size()
            || (auditArtifact != null
            && (!(auditArtifact instanceof Map)
            || auditArtifact.keySet() != ['dependency', 'sha256'] as Set
            || !(auditArtifact.dependency instanceof String)
            || auditArtifact.dependency.isBlank()
            || !(auditArtifact.sha256 instanceof String)
            || !(auditArtifact.sha256 ==~ /[0-9a-f]{64}/)
            || descriptor.dependencies[0] != auditArtifact.dependency
            || !(descriptor.runtimeDependencies instanceof List)
            || !descriptor.runtimeDependencies.contains(auditArtifact.dependency)))
            || (auditArtifact != null
            && descriptorRuntimeTransforms.any { transform ->
                transform.dependency == auditArtifact.dependency
                        && transform.sha256 != auditArtifact.sha256
            })
            || !(descriptor.matrix instanceof Map)
            || descriptor.matrix.mods == null
            || descriptor.matrix.descriptors == null
            || descriptor.matrix.resourceKinds == null
            || descriptor.matrix.acceptedRecipes == null
            || descriptor.matrix.rejectedDescriptors == null
            || descriptor.matrix.rejectedResourceKinds == null
            || !(descriptor.matrix.recipeInventory instanceof Map)
            || !(descriptor.matrix.recipeInventory.namespaces instanceof List)
            || !(descriptor.matrix.recipeInventory.sha256 instanceof String)
            || !(descriptor.matrix.recipeInventory.sha256 ==~ /[0-9a-f]{64}/)) {
        throw new GradleException(
                "Invalid compatibility module descriptor: ${descriptorFile}")
    }
    if (!descriptor.fixture.endsWith('Fixture')
            || descriptor.fixture.length() == 'Fixture'.length()) {
        throw new GradleException(
                "Compatibility fixture must end with Fixture: ${descriptorFile}")
    }
    def runName = descriptor.fixture.substring(
            0, descriptor.fixture.length() - 'Fixture'.length()) + 'GameTestServer'
    [
            id          : directoryId,
            moduleId    : descriptor.id,
            entrypoint  : descriptor.entrypoint,
            requires    : descriptor.requires.collect { it.toString() }.sort(),
            side        : descriptor.side,
            sourceSet   : descriptor.sourceSet,
            fixture     : descriptor.fixture,
            fixtureModId: "auto_storage_${directoryId}_fixture",
            descriptorFile: descriptorFile,
            runName     : runName,
            runTask     : "run${runName.substring(0, 1).toUpperCase()}${runName.substring(1)}",
            expectedTests: descriptor.expectedTests,
            dependencies: descriptor.dependencies.collect {
                expandCompatDependency(it.toString())
            },
            repositories: descriptorRepositories.collect {
                it.toString()
            },
            runtimeDependencies: descriptor.runtimeDependencies.collect {
                expandCompatDependency(it.toString())
            },
            runtimeArtifactTransforms: descriptorRuntimeTransforms.collect { transform ->
                [
                        dependency   : expandCompatDependency(
                                transform.dependency.toString()),
                        sha256      : transform.sha256.toString(),
                        removeEntries: transform.remove_entries.collect {
                            it.toString()
                        }.sort(),
                ]
            },
            auditArtifact: auditArtifact == null ? null : [
                    dependency: expandCompatDependency(
                            auditArtifact.dependency.toString()),
                    sha256    : auditArtifact.sha256.toString(),
            ],
    ]
}.sort { left, right -> left.moduleId <=> right.moduleId }

if (compatModules.collect { it.moduleId }.toSet().size() != compatModules.size()) {
    throw new GradleException('Duplicate compatibility module ID')
}

compatModules.each { spec ->
    spec.runtimeArtifactTransformsByDependency =
            spec.runtimeArtifactTransforms.collectEntries { transform ->
                [(transform.dependency): transform]
            }
}
def sharedCompatRuntimeTransforms = [:]
def sharedCompatRuntimeTransformDependenciesBySha = [:]
def claimCompatRuntimeArtifactSha = { dependenciesBySha, sha256, dependency ->
    def existingDependency = dependenciesBySha[sha256]
    if (existingDependency != null && existingDependency != dependency) {
        throw new GradleException(
                'Compatibility runtime artifact SHA is declared by multiple dependencies')
    }
    dependenciesBySha[sha256] = dependency
}
def mergeCompatRuntimeTransform = { shared, dependenciesBySha, transform ->
    def existing = shared[transform.dependency]
    if (existing != null
            && (existing.sha256 != transform.sha256
            || existing.removeEntries != transform.removeEntries)) {
        throw new GradleException(
                "Conflicting compatibility runtime artifact transform for ${transform.dependency}")
    }
    claimCompatRuntimeArtifactSha(
            dependenciesBySha,
            transform.sha256,
            transform.dependency)
    shared[transform.dependency] = transform
}
compatModules.findAll { it.auditArtifact != null }.each { spec ->
    claimCompatRuntimeArtifactSha(
            sharedCompatRuntimeTransformDependenciesBySha,
            spec.auditArtifact.sha256,
            spec.auditArtifact.dependency)
}
compatModules.each { spec ->
    spec.runtimeArtifactTransforms.each { transform ->
        mergeCompatRuntimeTransform(
                sharedCompatRuntimeTransforms,
                sharedCompatRuntimeTransformDependenciesBySha,
                transform)
    }
}
compatModules.each { spec ->
    spec.runtimeDependencies.each { dependency ->
        if (sharedCompatRuntimeTransforms.containsKey(dependency)
                && !spec.runtimeArtifactTransformsByDependency.containsKey(
                dependency)) {
            throw new GradleException(
                    "Compatibility runtime dependency ${dependency} must use its shared exact transform")
        }
    }
}
def validateCompatRuntimeDependencyNotations = { shared, notations ->
    notations.toSet().each { notation ->
        if (shared.containsKey(notation)) {
            throw new GradleException(
                    "Direct compatibility runtime dependency must use its shared exact transform: ${notation}")
        }
    }
}
def compatRuntimePlanningTestDirectory =
        layout.buildDirectory.dir('tmp/verifyCompatRuntimeTransformPlanning').get().asFile
def verifyCompatRuntimeTransformPlanning = tasks.register(
        'verifyCompatRuntimeTransformPlanning') {
    group = 'verification'
    description = 'Proves identical runtime transforms share one artifact and conflicts fail closed'
    doLast {
        def dependency = 'example.group:shared-runtime:1.0.0'
        def exact = [
                dependency   : dependency,
                sha256      : '1' * 64,
                removeEntries: ['example/gametest/ForeignTests.class'],
        ]
        def shared = [:]
        def dependenciesBySha = [:]
        mergeCompatRuntimeTransform(shared, dependenciesBySha, exact)
        mergeCompatRuntimeTransform(shared, dependenciesBySha,
                new LinkedHashMap(exact))
        if (shared.size() != 1) {
            throw new GradleException(
                    'Identical compatibility runtime transforms did not deduplicate')
        }
        for (conflict in [
                exact + [sha256: '2' * 64],
                exact + [removeEntries: ['example/gametest/OtherTests.class']],
        ]) {
            try {
                mergeCompatRuntimeTransform(shared, dependenciesBySha, conflict)
                throw new GradleException(
                        'Conflicting compatibility runtime transform was accepted')
            } catch (GradleException expected) {
                if (!expected.message.startsWith(
                        'Conflicting compatibility runtime artifact transform')) {
                    throw expected
                }
            }
        }
        def auditDependenciesBySha = [:]
        claimCompatRuntimeArtifactSha(
                auditDependenciesBySha,
                '3' * 64,
                'example.group:audited-runtime:1.0.0')
        try {
            mergeCompatRuntimeTransform(
                    [:],
                    auditDependenciesBySha,
                    exact + [
                            dependency: 'example.group:aliased-runtime:1.0.0',
                            sha256   : '3' * 64,
                    ])
            throw new GradleException(
                    'Compatibility runtime transform reused an audited artifact SHA')
        } catch (GradleException expected) {
            if (!expected.message.startsWith(
                    'Compatibility runtime artifact SHA is declared by multiple dependencies')) {
                throw expected
            }
        }
        try {
            validateCompatRuntimeDependencyNotations(shared, [dependency])
            throw new GradleException(
                    'Direct pristine compatibility runtime dependency was accepted')
        } catch (GradleException expected) {
            if (!expected.message.startsWith(
                    'Direct compatibility runtime dependency must use its shared exact transform')) {
                throw expected
            }
        }
        compatRuntimePlanningTestDirectory.mkdirs()
        def pristineArtifact = new File(
                compatRuntimePlanningTestDirectory,
                'pristine-runtime.jar')
        def transformedArtifact = new File(
                compatRuntimePlanningTestDirectory,
                'transformed-runtime.jar')
        def duplicateTransformedArtifact = new File(
                compatRuntimePlanningTestDirectory,
                'duplicate-transformed-runtime.jar')
        pristineArtifact.setText('pristine-runtime', 'UTF-8')
        transformedArtifact.setText('transformed-runtime', 'UTF-8')
        duplicateTransformedArtifact.setText('transformed-runtime', 'UTF-8')
        def runtimeTransform = [[
                dependency: dependency,
                sha256   : CompatRuntimeClasspathValidator.sha256(pristineArtifact),
        ]]
        def transformedOutputs = [(dependency): transformedArtifact]
        CompatRuntimeClasspathValidator.validate(
                [transformedArtifact],
                runtimeTransform,
                transformedOutputs)
        for (invalidRuntime in [
                [pristineArtifact, transformedArtifact],
                [transformedArtifact, duplicateTransformedArtifact],
        ]) {
            try {
                CompatRuntimeClasspathValidator.validate(
                        invalidRuntime,
                        runtimeTransform,
                        transformedOutputs)
                throw new GradleException(
                        'Invalid compatibility runtime classpath was accepted')
            } catch (GradleException expected) {
                if (!expected.message.startsWith('Pristine compatibility runtime artifact')
                        && !expected.message.startsWith('Transformed compatibility runtime artifact is duplicated')) {
                    throw expected
                }
            }
        }
    }
}

def generatedCompatModuleIndexDir =
        layout.buildDirectory.dir('generated/resources/compatModules')
def generateCompatModuleIndex = tasks.register('generateCompatModuleIndex') {
    inputs.files(compatModuleFiles)
    def indexFile = generatedCompatModuleIndexDir.map {
        it.file('META-INF/auto_storage/compat-modules.json')
    }
    outputs.file(indexFile)
    doLast {
        def output = [
                schema : 1,
                modules: compatModules.collect { module ->
                    [
                            id        : module.moduleId,
                            entrypoint: module.entrypoint,
                            requires  : module.requires,
                            side      : module.side,
                    ]
                },
        ]
        def target = indexFile.get().asFile
        target.parentFile.mkdirs()
        target.text = JsonOutput.prettyPrint(JsonOutput.toJson(output)) + '\n'
    }
}

