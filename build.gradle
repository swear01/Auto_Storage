        def text = compatibilityMatrixLatestLog.getText('UTF-8')
        def warmStart = text.indexOf('TERMINAL_SCALE_WARM_INTERACTIONS_BEGIN')
        def warmEnd = text.indexOf('TERMINAL_SCALE_WARM_INTERACTIONS_END', warmStart + 1)
        def warmLog = warmStart >= 0 && warmEnd > warmStart
                ? text.substring(warmStart, warmEnd)
                : ''
        if (!text.contains('All 3 required tests passed')
                || !text.contains(expectedSelfTestSummary)
                || text.contains('TESTS FAILED!')
                || warmLog.isEmpty()
                || warmLog.contains("Can't keep up!")) {
            throw new GradleException(
                    'Compatibility matrix GameTest or SelfTest did not pass; inspect run/logs/latest.log')
        }
    }
