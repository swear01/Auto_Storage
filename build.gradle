def compatFixtureRunTasks = []
def compatVerificationRoot = layout.projectDirectory.asFile.toPath().toRealPath()
def compatGameTestRunDir = layout.projectDirectory.dir('run').asFile
def compatGameTestWorldDir = layout.projectDirectory.dir('run/world').asFile
def clearCompatGameTestWorld = {
    for (candidate in [compatGameTestRunDir, compatGameTestWorldDir]) {
        def candidatePath = candidate.toPath().toAbsolutePath().normalize()
        if (Files.isSymbolicLink(candidatePath)) {
            throw new GradleException(
                    "Compatibility GameTest path is a symlink: ${candidate}")
        }
        if (!candidatePath.startsWith(compatVerificationRoot)) {
            throw new GradleException(
                    "Compatibility GameTest path escapes project root: ${candidate}")
        }
        if (Files.exists(candidatePath)
                && !candidatePath.toRealPath().startsWith(compatVerificationRoot)) {
            throw new GradleException(
                    "Compatibility GameTest path resolves outside project root: ${candidate}")
        }
    }
    CompatWorldCleaner.deleteTree(compatGameTestWorldDir.toPath())
}
def compatCleanupTestRootParent = layout.buildDirectory.dir('tmp').get().asFile.toPath()
def verifyCompatGameTestWorldCleanupSafety = tasks.register(
        'verifyCompatGameTestWorldCleanupSafety') {
    group = 'verification'
    description = 'Reject nested symlinks without deleting their external target'
    doLast {
        Files.createDirectories(compatCleanupTestRootParent)
        def fixtureRoot = Files.createTempDirectory(
                compatCleanupTestRootParent,
                'compat-world-cleanup-')
        def externalRoot = Files.createTempDirectory('auto-storage-cleanup-sentinel-')
        def world = fixtureRoot.resolve('world')
        def nested = world.resolve('nested')
        def link = nested.resolve('external')
        def sentinel = externalRoot.resolve('keep.txt')
        try {
            Files.createDirectories(nested)
            Files.writeString(sentinel, 'keep')
            Files.createSymbolicLink(link, externalRoot)
            try {
                CompatWorldCleaner.deleteTree(world)
                throw new GradleException(
                        'Compatibility GameTest cleanup accepted a nested symlink')
            } catch (GradleException expected) {
                if (!expected.message.contains('contains a symlink')) {
                    throw expected
                }
            }
            if (!Files.isRegularFile(sentinel)) {
                throw new GradleException(
                        'Compatibility GameTest cleanup deleted an external sentinel')
            }
        } finally {
            Files.deleteIfExists(link)
            CompatWorldCleaner.deleteTree(fixtureRoot)
            CompatWorldCleaner.deleteTree(externalRoot)
        }
    }
}
compatModules.each { spec ->
    def fixtureTask = tasks.named(spec.runTask)
    def previousCompatFixture = compatFixtureRunTasks.isEmpty()
            ? null
            : compatFixtureRunTasks.last()
    fixtureTask.configure {
        doFirst {
            clearCompatGameTestWorld()
        }
        if (previousCompatFixture != null) {
            mustRunAfter previousCompatFixture
        }
    }
    compatFixtureRunTasks << fixtureTask
}
tasks.register('runCompatFixtureGameTestServers') {
    group = 'verification'
    description = 'Run every descriptor-owned compatibility fixture GameTest server'
    dependsOn compatFixtureRunTasks
}
tasks.named('check').configure {
    dependsOn verifyCompatGameTestWorldCleanupSafety
}

