tasks.register("stagePrismGuiSupportMods", Sync) {
    dependsOn tasks.named("verifyBotaniaFixtureArtifact")
    inputs.file(macfixGuiArtifact)
    inputs.property("macfixSha256", expectedMacfixGuiSha256)
    into layout.buildDirectory.dir("prism-gui-mods")
    doFirst {
        def artifact = macfixGuiArtifact.asFile
        if (!artifact.isFile()) {
            throw new GradleException("MacFix GUI artifact not found: ${artifact}")
        }
        def digest = java.security.MessageDigest.getInstance("SHA-256")
        artifact.withInputStream { input ->
            byte[] buffer = new byte[8192]
            for (int read = input.read(buffer); read != -1; read = input.read(buffer)) {
                digest.update(buffer, 0, read)
            }
        }
        def actual = digest.digest().encodeHex().toString()
        if (actual != expectedMacfixGuiSha256) {
            throw new GradleException(
                    "MacFix GUI artifact SHA-256 mismatch: expected ${expectedMacfixGuiSha256}, got ${actual}")
        }
    }
    from(macfixGuiArtifact) {
        rename { "macfix-gui-test.jar" }
    }
    from(configurations.prismGuiIronFurnaces) {
