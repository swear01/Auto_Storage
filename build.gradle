    def fixture = sourceSets.maybeCreate(spec.fixture)
    fixture.compileClasspath += sourceSets.main.output + configurations.compileClasspath
    fixture.runtimeClasspath += fixture.output + sourceSets.main.runtimeClasspath
    fixture.compileClasspath += compatSourceSets[spec.id].output
    fixture.runtimeClasspath += compatSourceSets[spec.id].output
}

