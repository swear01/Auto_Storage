def compatFixtureDirectRuntimeDependencies = sourceSets.findAll {
    it.name.endsWith('Fixture')
}.collectMany { fixtureSourceSet ->
    configurations.getByName(
            fixtureSourceSet.runtimeOnlyConfigurationName)
            .dependencies
            .withType(org.gradle.api.artifacts.ExternalModuleDependency)
            .collect { dependency ->
                "${dependency.group}:${dependency.name}:${dependency.version}"
            }
}
validateCompatRuntimeDependencyNotations(
        sharedCompatRuntimeTransforms,
        compatFixtureDirectRuntimeDependencies)

def registerCompatRuntimeIsolationVerification = {
    fixtureSourceSet, transforms, taskName ->
        if (transforms.isEmpty()) {
            return null
        }
        def transformRecords = transforms.collect { transform ->
            [
                    dependency: transform.dependency.toString(),
                    sha256   : transform.sha256.toString(),
            ]
        }
        def transformedOutputs = transforms.collectEntries { transform ->
            [
                    (transform.dependency.toString()):
                            runtimeTransformOutputs[transform.dependency].get().asFile,
            ]
        }
        tasks.register(taskName) {
            group = 'verification'
            description = 'Rejects pristine or duplicate artifacts on a transformed fixture runtime classpath'
            inputs.files(fixtureSourceSet.runtimeClasspath)
            dependsOn transforms.collect { transform ->
                runtimeTransformTasks[transform.dependency]
            }
            doLast {
                CompatRuntimeClasspathValidator.validate(
                        inputs.files.files,
                        transformRecords,
                        transformedOutputs)
            }
        }
}
def compatRuntimeIsolationTasks = []
compatModules.each { spec ->
    def fixtureSourceSet = sourceSets[spec.fixture]
    def runtimeIsolationTask = registerCompatRuntimeIsolationVerification(
            fixtureSourceSet,
            spec.runtimeArtifactTransforms,
            "verify${spec.fixture.substring(0, 1).toUpperCase()}${spec.fixture.substring(1)}RuntimeTransformIsolation")
    if (runtimeIsolationTask != null) {
        tasks.named(spec.runTask).configure {
            dependsOn runtimeIsolationTask
        }
        compatRuntimeIsolationTasks << runtimeIsolationTask
    }
}
def compatibilityMatrixRuntimeIsolationTask =
        registerCompatRuntimeIsolationVerification(
                sourceSets.compatibilityMatrixFixture,
                sharedCompatRuntimeTransforms.values().toList(),
                'verifyCompatibilityMatrixRuntimeTransformIsolation')
if (compatibilityMatrixRuntimeIsolationTask != null) {
    compatRuntimeIsolationTasks << compatibilityMatrixRuntimeIsolationTask
}

def ae2CompatAuditAncestryDir =
        layout.buildDirectory.dir("compat-kit/ae2-audit-optional-ancestry")
def ae2CompatAuditAncestryManifest =
        layout.buildDirectory.file("compat-kit/ae2-audit-optional-ancestry.txt")
def compatKitProjectDir = layout.projectDirectory.asFile
def compatKitMinecraftArtifacts =
        tasks.named("createMinecraftArtifacts").get().outputs.files
tasks.register("stageAe2CompatAuditAncestry") {
    group = "verification"
    description = "Stages every exact ancestry jar used by the committed AE2 audit."
    inputs.files(
            configurations.ae2CompatAuditAncestry,
            configurations.additionalRuntimeClasspath,
            compatKitMinecraftArtifacts)
    inputs.file("compat/audits/ae2/19.2.17.json")
    outputs.dir(ae2CompatAuditAncestryDir)
    outputs.file(ae2CompatAuditAncestryManifest)
    doLast {
        def auditFile = inputs.files.files.find {
            it.name == "19.2.17.json"
        }
        def audit = new JsonSlurper().parse(auditFile)
        def expected = audit.ancestry_classpath.collectEntries { record ->
            [("${record.sha256}:${record.size}"): record]
        }
        def artifacts = inputs.files.files.findAll {
            it.name.endsWith(".jar")
        }
        def expectedSizes = audit.ancestry_classpath.collect {
            it.size.longValue()
        }.toSet()
        def matches = [:]
        artifacts.findAll {
            expectedSizes.contains(it.length())
        }.each { artifact ->
            def digest = java.security.MessageDigest.getInstance("SHA-256")
            artifact.withInputStream { input ->
                byte[] buffer = new byte[8192]
                for (int read = input.read(buffer); read != -1; read = input.read(buffer)) {
                    digest.update(buffer, 0, read)
                }
            }
            def identity = "${digest.digest().encodeHex().toString()}:${artifact.length()}"
            if (expected.containsKey(identity)) {
                matches[identity] = artifact
            }
        }
        def canonicalRoot = new File(
                temporaryDir,
                "ae2-audit-canonical")
        canonicalRoot.deleteDir()
        canonicalRoot.mkdirs()
        def observedCanonical = []
        compatKitMinecraftArtifacts.files
                .findAll { it.isFile() && it.name.endsWith(".jar") }
                .sort { left, right ->
                    left.absolutePath <=> right.absolutePath
                }
                .eachWithIndex { artifact, index ->
                    def canonical = new File(canonicalRoot, "${index}.jar")
                    def process = new ProcessBuilder(
                            "python3",
                            "tools/compat-kit/compat_kit.py",
                            "normalize-jar",
                            artifact.absolutePath,
                            canonical.absolutePath)
                            .directory(compatKitProjectDir)
                            .redirectErrorStream(true)
                            .start()
                    def processOutput = process.inputStream.getText("UTF-8").trim()
                    def exitCode = process.waitFor()
                    if (exitCode != 0) {
                        throw new GradleException(
                                "AE2 audit ancestry normalization failed: "
                                        + artifact + " (exit " + exitCode + ")"
                                        + (processOutput ? ": " + processOutput : ""))
                    }
                    def digest = java.security.MessageDigest.getInstance("SHA-256")
                    canonical.withInputStream { input ->
                        byte[] buffer = new byte[8192]
                        for (int read = input.read(buffer); read != -1; read = input.read(buffer)) {
                            digest.update(buffer, 0, read)
                        }
                    }
                    def identity = "${digest.digest().encodeHex().toString()}:${canonical.length()}"
                    observedCanonical.add("${identity}=${artifact.name}")
                    if (expected.containsKey(identity)) {
                        matches[identity] = canonical
                    }
                }
        def missing = expected.keySet() - matches.keySet()
        if (!missing.isEmpty()) {
            throw new GradleException(
                    "AE2 audit ancestry is unresolved: "
                            + missing.toList().sort().join(", ")
                            + "; observed ModDev canonical artifacts: "
                            + (observedCanonical
                                    ? observedCanonical.sort().join(", ")
                                    : "<none>"))
        }
        def outputDir = outputs.files.files.find {
            it.name == "ae2-audit-optional-ancestry"
        }
        outputDir.deleteDir()
        outputDir.mkdirs()
        def staged = audit.ancestry_classpath.collect { record ->
            def identity = "${record.sha256}:${record.size}"
            def artifact = matches[identity]
            def target = new File(outputDir, "${record.sha256}.jar")
            java.nio.file.Files.copy(
                    artifact.toPath(),
                    target.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            target.absolutePath
        }.sort()
        def manifest = outputs.files.files.find {
            it.name == "ae2-audit-optional-ancestry.txt"
        }
        manifest.parentFile.mkdirs()
        manifest.text = staged.join("\n") + "\n"
    }
}

def compatArtifactVerificationTasks = []
compatModules.findAll { it.auditArtifact != null }.each { spec ->
    def configurationName = "${spec.sourceSet}AuditArtifact"
    def artifactConfiguration = configurations.create(configurationName) {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    dependencies.add(configurationName, spec.auditArtifact.dependency)
    def taskStem = spec.fixture.substring(
            0, spec.fixture.length() - 'Fixture'.length())
    taskStem = taskStem.substring(0, 1).toUpperCase() + taskStem.substring(1)
    def verifyCompatArtifactTaskName = "verify${taskStem}CompatArtifact"
    def verifyTask = tasks.register(verifyCompatArtifactTaskName) {
        inputs.files(artifactConfiguration)
        inputs.property("expectedSha256", spec.auditArtifact.sha256)
        doLast {
            def artifacts = inputs.files.files.findAll {
                it.name.endsWith(".jar")
            }
            if (artifacts.size() != 1) {
                throw new GradleException(
                        "${spec.id} audit verification expected one resolved jar, found ${artifacts.size()}")
            }
            def digest = java.security.MessageDigest.getInstance("SHA-256")
            artifacts.iterator().next().withInputStream { input ->
                byte[] buffer = new byte[8192]
                for (int read = input.read(buffer); read != -1; read = input.read(buffer)) {
                    digest.update(buffer, 0, read)
                }
            }
            def actual = digest.digest().encodeHex().toString()
            if (actual != spec.auditArtifact.sha256) {
                throw new GradleException(
                        "${spec.id} audit artifact SHA-256 mismatch: expected "
                                + "${spec.auditArtifact.sha256}, got ${actual}")
            }
        }
    }
    compatArtifactVerificationTasks.add(verifyTask)
    tasks.named(spec.runTask).configure {
        dependsOn verifyTask
    }
}

