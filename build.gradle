import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.nio.file.FileVisitResult
import java.nio.file.Files
import java.nio.file.SimpleFileVisitor
import java.nio.file.attribute.BasicFileAttributes

class CompatWorldCleaner {
    static void deleteTree(java.nio.file.Path root) {
        if (!Files.exists(root, java.nio.file.LinkOption.NOFOLLOW_LINKS)) {
            return
        }
        if (Files.isSymbolicLink(root)) {
            throw new GradleException("Compatibility GameTest path is a symlink: ${root}")
        }
        Files.walkFileTree(root, new SimpleFileVisitor<java.nio.file.Path>() {
            @Override
            FileVisitResult preVisitDirectory(
                    java.nio.file.Path directory,
                    BasicFileAttributes attributes) {
                if (Files.isSymbolicLink(directory)) {
                    throw new GradleException(
                            "Compatibility GameTest tree contains a symlink: ${directory}")
                }
                return FileVisitResult.CONTINUE
            }

            @Override
            FileVisitResult visitFile(
                    java.nio.file.Path file,
                    BasicFileAttributes attributes) {
                if (Files.isSymbolicLink(file)) {
                    throw new GradleException(
                            "Compatibility GameTest tree contains a symlink: ${file}")
                }
                Files.delete(file)
                return FileVisitResult.CONTINUE
            }

            @Override
            FileVisitResult visitFileFailed(
                    java.nio.file.Path file,
                    IOException failure) {
                throw new GradleException(
                        "Cannot inspect compatibility GameTest path: ${file}", failure)
            }

            @Override
            FileVisitResult postVisitDirectory(
                    java.nio.file.Path directory,
                    IOException failure) {
                if (failure != null) {
                    throw new GradleException(
                            "Cannot inspect compatibility GameTest directory: ${directory}",
                            failure)
                }
                Files.delete(directory)
                return FileVisitResult.CONTINUE
            }
        })
    }
}

class CompatRuntimeClasspathValidator {
    static String sha256(File file) {
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        file.withInputStream { input ->
            byte[] buffer = new byte[8192]
            for (int read = input.read(buffer); read != -1; read = input.read(buffer)) {
                digest.update(buffer, 0, read)
            }
        }
        digest.digest().encodeHex().toString()
    }

    static void validate(
            Collection<File> runtimeFiles,
            Collection<Map<String, String>> transforms,
            Map<String, File> transformedOutputs) {
        def records = runtimeFiles.findAll { it.isFile() }.collect { file ->
            [file: file.canonicalFile, sha256: sha256(file)]
        }
        transforms.each { transform ->
            if (records.any { it.sha256 == transform.sha256 }) {
                throw new GradleException(
                        "Pristine compatibility runtime artifact is present: ${transform.dependency}")
            }
            def expectedOutput = transformedOutputs[transform.dependency]
            if (expectedOutput == null || !expectedOutput.isFile()) {
                throw new GradleException(
                        "Transformed compatibility runtime artifact is missing: ${transform.dependency}")
            }
            def expectedPath = expectedOutput.canonicalFile
            if (records.count { it.file == expectedPath } != 1) {
                throw new GradleException(
                        "Transformed compatibility runtime artifact is missing: ${transform.dependency}")
            }
            def transformedSha256 = sha256(expectedOutput)
            if (records.count { it.sha256 == transformedSha256 } != 1) {
                throw new GradleException(
                        "Transformed compatibility runtime artifact is duplicated: ${transform.dependency}")
            }
        }
    }
}

