def apiClassIncludes = apiClassNames.collectMany { name ->
    ["com/swear/autostorage/${name}.class",
     "com/swear/autostorage/${name}\$*.class"]
}
def apiSourceIncludes = apiClassNames.collect { name ->
    "com/swear/autostorage/${name}.java"
}

def apiJar = tasks.register('apiJar', Jar) {
    group = 'build'
    description = 'Builds the compile-only Auto Storage addon API artifact.'
    dependsOn tasks.named(apiSourceSet.classesTaskName)
    dependsOn tasks.named(sourceSets.main.classesTaskName)
    archiveClassifier.set('api')
    from(apiSourceSet.output) {
        exclude 'com/swear/autostorage/api/AutoStorageAddonLifecycle*.class'
    }
    from(sourceSets.main.output) {
        include apiClassIncludes
    }
    from(rootProject.file('LICENSE'))
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

compatSourceSets.each { moduleId, sourceSet ->
    sourceSet.compileClasspath += files(apiJar)
    tasks.named(sourceSet.compileJavaTaskName).configure {
        dependsOn apiJar
    }
}

def apiSourcesJar = tasks.register('apiSourcesJar', Jar) {
    group = 'build'
    description = 'Builds sources for the Auto Storage addon API.'
    archiveClassifier.set('api-sources')
    from(apiSourceSet.allSource) {
        exclude 'com/swear/autostorage/api/AutoStorageAddonLifecycle.java'
    }
    from('src/main/java') {
        include apiSourceIncludes
    }
    from(rootProject.file('LICENSE'))
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

def apiJavadoc = tasks.register('apiJavadoc', Javadoc) {
    group = 'documentation'
    description = 'Builds Javadocs for the Auto Storage addon API.'
    dependsOn tasks.named(apiSourceSet.classesTaskName)
    dependsOn tasks.named(sourceSets.main.classesTaskName)
    source = files(
            apiSourceSet.allJava.matching {
                exclude 'com/swear/autostorage/api/AutoStorageAddonLifecycle.java'
            },
            fileTree('src/main/java') {
                include apiSourceIncludes
            })
    classpath = files(
            apiSourceSet.compileClasspath,
            apiSourceSet.output,
            sourceSets.main.compileClasspath,
            sourceSets.main.output)
    destinationDir = layout.buildDirectory.dir('docs/api-javadoc').get().asFile
    options.encoding = 'UTF-8'
    failOnError = true
}

def apiJavadocJar = tasks.register('apiJavadocJar', Jar) {
    group = 'build'
    description = 'Builds Javadocs for the Auto Storage addon API artifact.'
    archiveClassifier.set('api-javadoc')
    dependsOn apiJavadoc
    from(apiJavadoc)
    from(rootProject.file('LICENSE'))
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

