def runtimeTransformTasks = [:]
def runtimeTransformOutputs = [:]
def compatKitRuntimeTransformScript =
        layout.projectDirectory.file('tools/compat-kit/compat_kit.py').asFile
def compatKitRuntimeTransformWorkingDirectory =
        layout.projectDirectory.asFile
sharedCompatRuntimeTransforms.values().sort { left, right ->
    left.dependency <=> right.dependency
}.eachWithIndex { transform, index ->
    def configurationName = "compatRuntimeTransform${index}Artifact"
    def artifactConfiguration = configurations.create(configurationName) {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    dependencies.add(configurationName, transform.dependency) {
        transitive = false
    }
    def planDigest = java.security.MessageDigest.getInstance('SHA-256')
            .digest(([transform.dependency, transform.sha256]
            + transform.removeEntries).join('\n')
            .getBytes(java.nio.charset.StandardCharsets.UTF_8))
            .encodeHex().toString()
    def outputJar = layout.buildDirectory.file(
            "compat-kit/runtime-transforms/${transform.sha256}-${planDigest}.jar")
    def outputFile = outputJar.get().asFile
    def transformDependency = transform.dependency.toString()
    def transformSha256 = transform.sha256.toString()
    def transformRemoveEntries = transform.removeEntries.collect {
        it.toString()
    }
    def transformTask = tasks.register(
            "transformCompatRuntimeArtifact${planDigest}", Exec) {
        inputs.files(artifactConfiguration)
        inputs.file(compatKitRuntimeTransformScript)
        inputs.property('dependency', transformDependency)
        inputs.property('expectedSha256', transformSha256)
        inputs.property('removeEntries', transformRemoveEntries)
        outputs.file(outputFile)
        outputs.cacheIf { true }
        workingDir = compatKitRuntimeTransformWorkingDirectory
        doFirst {
            def artifacts = inputs.files.files.findAll {
                it != compatKitRuntimeTransformScript
            }
            if (artifacts.size() != 1
                    || !artifacts.iterator().next().name.endsWith('.jar')) {
                throw new GradleException(
                        "Compatibility runtime transform expected one resolved jar for "
                                + "${transformDependency}, found ${artifacts.size()}")
            }
            def command = [
                    'python3',
                    compatKitRuntimeTransformScript.absolutePath,
                    "transform-runtime-artifact",
                    artifacts.iterator().next().absolutePath,
                    outputFile.absolutePath,
                    "--expected-sha256",
                    transformSha256,
            ]
            transformRemoveEntries.each { entry ->
                command.add("--remove-entry")
                command.add(entry)
            }
            commandLine command
        }
    }
    runtimeTransformTasks[transform.dependency] = transformTask
    runtimeTransformOutputs[transform.dependency] = outputJar
}
compatModules.each { spec ->
    tasks.named(spec.runTask).configure {
        dependsOn spec.runtimeArtifactTransforms.collect { transform ->
            runtimeTransformTasks[transform.dependency]
        }
    }
}

