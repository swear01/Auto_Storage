base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    enable {
        version = project.neo_version
        disableRecompilation = true
    }
    addModdingDependenciesTo apiSourceSet
    addModdingDependenciesTo sourceSets.fusionRuntime
    addModdingDependenciesTo sourceSets.recipeAddonFixture
    addModdingDependenciesTo sourceSets.pneumaticCraftFixture
    addModdingDependenciesTo sourceSets.compatibilityMatrixFixture
    addModdingDependenciesTo sourceSets.addonExample
    addModdingDependenciesTo sourceSets.compatKitGeneratedFixture
    compatModules.each { spec ->
        addModdingDependenciesTo compatSourceSets[spec.id]
        addModdingDependenciesTo sourceSets[spec.fixture]
    }

    mods {
        "${mod_id}" {
            sourceSet(apiSourceSet)
            sourceSet(sourceSets.main)
            compatSourceSets.values().each { compatSourceSet ->
                sourceSet(compatSourceSet)
            }
        }
        auto_storage_recipe_fixture {
            sourceSet(sourceSets.recipeAddonFixture)
        }
        auto_storage_pneumaticcraft_fixture {
            sourceSet(sourceSets.pneumaticCraftFixture)
        }
        compatModules.each { spec ->
            "${spec.fixtureModId}" {
                sourceSet(sourceSets[spec.fixture])
            }
        }
        auto_storage_compatibility_matrix_fixture {
            sourceSet(sourceSets.compatibilityMatrixFixture)
        }
    }

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            sourceSet = sourceSets.fusionRuntime
            loadedMods = [mods."${mod_id}"]
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            loadedMods = [mods."${mod_id}"]
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            loadedMods = [mods."${mod_id}"]
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        recipeAddonGameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.recipeAddonFixture
            loadedMods = [mods."${mod_id}", mods.auto_storage_recipe_fixture]
            systemProperty 'neoforge.enabledGameTestNamespaces', 'auto_storage_recipe_fixture'
        }

        pneumaticCraftGameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.pneumaticCraftFixture
            loadedMods = [mods."${mod_id}", mods.auto_storage_pneumaticcraft_fixture]
            systemProperty 'neoforge.enabledGameTestNamespaces',
                    'auto_storage_pneumaticcraft_fixture'
        }

        compatModules.each { spec ->
            "${spec.runName}" {
                type = "gameTestServer"
                sourceSet = sourceSets[spec.fixture]
                loadedMods = [mods."${mod_id}", mods."${spec.fixtureModId}"]
                systemProperty 'neoforge.enabledGameTestNamespaces', spec.fixtureModId
            }
        }

        compatibilityMatrixGameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.compatibilityMatrixFixture
            loadedMods = [mods."${mod_id}", mods.auto_storage_compatibility_matrix_fixture]
            systemProperty 'neoforge.enabledGameTestNamespaces',
                    'auto_storage_compatibility_matrix_fixture'
            systemProperty 'auto_storage.terminalScaleTypes',
                    providers.gradleProperty('terminalScaleTypes').orElse('10000').get()
        }

        data {
            data()
            sourceSet = sourceSets.fusionRuntime
            loadedMods = [mods."${mod_id}"]
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

}

