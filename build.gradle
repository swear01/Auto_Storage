def commonJavaSources = files(
        fileTree('src/api/java') { include '**/*.java' },
        fileTree('src/main/java') { include '**/*.java' })
tasks.register('verifyCompatIsolation') {
    group = 'verification'
    description = 'Rejects optional-mod imports in main and optional/client links in the API jar.'
    dependsOn apiJar
    inputs.files(commonJavaSources)
    inputs.file(apiJarFile)
    doLast {
        def forbiddenSourcePrefixes = [
                'import mekanism.',
                'import vazkii.botania.',
                'import ironfurnaces.',
                'import vectorwing.farmersdelight.',
                'import aztech.modern_industrialization.',
                'import com.hollingsworth.arsnouveau.',
                'import org.cyclops.evilcraft.',
                'import owmii.powah.',
                'import com.buuz135.industrial.',
                'import com.simibubi.create.',
                'import com.blakebr0.extendedcrafting.',
        ]
        commonJavaSources.files.each { source ->
            def text = source.getText('UTF-8')
            def forbidden = forbiddenSourcePrefixes.find { text.contains(it) }
            if (forbidden != null) {
                throw new GradleException(
                        "Main source ${source} directly links optional target package ${forbidden}")
            }
        }

        def forbiddenBytecode = [
                'net/minecraft/client/',
                'mekanism/',
                'vazkii/botania/',
                'ironfurnaces/',
                'vectorwing/farmersdelight/',
                'aztech/modern_industrialization/',
                'com/hollingsworth/arsnouveau/',
                'org/cyclops/evilcraft/',
                'owmii/powah/',
                'com/buuz135/industrial/',
                'com/simibubi/create/',
                'com/blakebr0/extendedcrafting/',
        ]
        def archive = apiJarFile.get().asFile
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            zip.entries().each { entry ->
                if (!entry.name.endsWith('.class')) return
                byte[] bytes = zip.getInputStream(entry).readAllBytes()
                String constants = new String(
                        bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                def forbidden = forbiddenBytecode.find { constants.contains(it) }
                if (forbidden != null) {
                    throw new GradleException(
                            "API class ${entry.name} links forbidden package ${forbidden}")
                }
            }
        }
    }
}

