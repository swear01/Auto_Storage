def compatSourceSets = [:]
compatModules.each { spec ->
    compatSourceSets[spec.id] = sourceSets.create(spec.sourceSet) {
        java.srcDir("src/compat/${spec.id}/java")
        resources.srcDir("src/compat/${spec.id}/resources")
        runtimeClasspath += output + apiSourceSet.output + sourceSets.main.runtimeClasspath
    }
    def fixture = sourceSets.maybeCreate(spec.fixture)
    fixture.compileClasspath += sourceSets.main.output + configurations.compileClasspath
    fixture.runtimeClasspath += fixture.output + sourceSets.main.runtimeClasspath
    fixture.compileClasspath += compatSourceSets[spec.id].output
    fixture.runtimeClasspath += compatSourceSets[spec.id].output
    def isolatedEvidenceDir = layout.buildDirectory.dir(
            "generated/resources/isolatedRecipeInventory/${spec.fixture}")
    def generateIsolatedEvidence = tasks.register(
            "generateIsolatedRecipeInventory_${spec.fixture}") {
        inputs.file(spec.descriptorFile)
        def evidenceFile = isolatedEvidenceDir.map {
            it.file('META-INF/auto_storage/isolated-recipe-inventory.json')
        }
        outputs.file(evidenceFile)
        doLast {
            def inventory = spec.descriptorFile.withReader('UTF-8') { reader ->
                new groovy.json.JsonSlurper().parse(reader)
            }.matrix.recipeInventory
            def target = evidenceFile.get().asFile
            target.parentFile.mkdirs()
            target.setText(groovy.json.JsonOutput.prettyPrint(
                    groovy.json.JsonOutput.toJson(inventory)) + '\n', 'UTF-8')
        }
    }
    fixture.resources.srcDir(isolatedEvidenceDir)
    tasks.named(fixture.processResourcesTaskName).configure {
        dependsOn generateIsolatedEvidence
    }
}

def pneumaticIsolatedEvidenceDir = layout.buildDirectory.dir(
        'generated/resources/isolatedRecipeInventory/pneumaticCraftFixture')
def generatePneumaticIsolatedEvidence = tasks.register(
        'generateIsolatedRecipeInventory_pneumaticCraftFixture') {
    inputs.file(compatibilityMatrixCompanionsFile)
    def evidenceFile = pneumaticIsolatedEvidenceDir.map {
        it.file('META-INF/auto_storage/isolated-recipe-inventory.json')
    }
    outputs.file(evidenceFile)
    doLast {
        def companions = compatibilityMatrixCompanionsFile.asFile
                .withReader('UTF-8') { reader ->
                    new groovy.json.JsonSlurper().parse(reader)
                }
        def companion = companions.companions.find { it.id == 'pneumaticcraft' }
        if (companion == null || companion.recipeInventory == null) {
            throw new GradleException(
                    'pneumaticcraft companion recipeInventory is required for isolated evidence')
        }
        def target = evidenceFile.get().asFile
        target.parentFile.mkdirs()
        target.setText(groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson(companion.recipeInventory)) + '\n', 'UTF-8')
    }
}
