name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: publishing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3
        with:
          cache-provider: basic

      - name: Prepare CI logs
        run: mkdir -p build/ci-logs

      - name: Check tag matches mod_version
        id: release-meta
        run: |
          VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          TAG="$GITHUB_REF_NAME"
          if [ "v${VERSION}" != "$TAG" ]; then
            echo "Tag $TAG does not match gradle.properties mod_version=$VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check publisher configuration
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
        run: |
          : "${MODRINTH_TOKEN:?MODRINTH_TOKEN publishing secret is required}"
          : "${CURSEFORGE_TOKEN:?CURSEFORGE_TOKEN publishing secret is required}"
          : "${MODRINTH_PROJECT_ID:?MODRINTH_PROJECT_ID publishing variable is required}"
          : "${CURSEFORGE_PROJECT_ID:?CURSEFORGE_PROJECT_ID publishing variable is required}"

      - name: Build
        run: |
          set -o pipefail
          ./gradlew build --console=plain --no-daemon 2>&1 | tee build/ci-logs/build.log

      - name: Verify minimum and latest compatible EMI releases
        run: |
          set -o pipefail
          MIN_EMI="$(sed -n 's/^emi_version=//p' gradle.properties)"
          MIN_EMI_RUNTIME="$(sed -n 's/^emi_runtime_version=//p' gradle.properties)"
          LATEST_EMI="$(python3 scripts/resolve_emi_version.py)"
          LATEST_EMI_RUNTIME="$(python3 scripts/resolve_emi_runtime.py "$LATEST_EMI")"
          ./gradlew compileJava -Pemi_version="$MIN_EMI" -Pemi_runtime_version="$MIN_EMI_RUNTIME" --console=plain --no-daemon 2>&1 | tee build/ci-logs/emi-minimum.log
          ./gradlew compileJava -Pemi_version="$LATEST_EMI" -Pemi_runtime_version="$LATEST_EMI_RUNTIME" --rerun-tasks --console=plain --no-daemon 2>&1 | tee build/ci-logs/emi-latest.log

      - name: Run GameTest server
        run: |
          set -o pipefail
          python3 -c 'import shutil; shutil.rmtree("run/world", ignore_errors=True)'
          ./gradlew runGameTestServer --console=plain --no-daemon 2>&1 | tee build/ci-logs/gametest.log

      - name: Run recipe addon GameTest server
        run: |
          set -o pipefail
          python3 -c 'import shutil; shutil.rmtree("run/world", ignore_errors=True)'
          ./gradlew runRecipeAddonGameTestServer --console=plain --no-daemon 2>&1 | tee build/ci-logs/recipe-addon-gametest.log

      - name: Run Mekanism GameTest server
        run: |
          set -o pipefail
          python3 -c 'import shutil; shutil.rmtree("run/world", ignore_errors=True)'
          ./gradlew runMekanismGameTestServer --console=plain --no-daemon 2>&1 | tee build/ci-logs/mekanism-gametest.log

      - name: Run Botania GameTest server
        run: |
          set -o pipefail
          python3 -c 'import shutil; shutil.rmtree("run/world", ignore_errors=True)'
          ./gradlew runBotaniaGameTestServer --console=plain --no-daemon 2>&1 | tee build/ci-logs/botania-gametest.log

      - name: Run Iron Furnaces GameTest server
        run: |
          set -o pipefail
          python3 -c 'import shutil; shutil.rmtree("run/world", ignore_errors=True)'
          ./gradlew runIronFurnacesGameTestServer --console=plain --no-daemon 2>&1 | tee build/ci-logs/iron-furnaces-gametest.log

      - name: Run Farmer's Delight GameTest server
        run: |
          set -o pipefail
          python3 -c 'import shutil; shutil.rmtree("run/world", ignore_errors=True)'
          ./gradlew runFarmersDelightGameTestServer --console=plain --no-daemon 2>&1 | tee build/ci-logs/farmers-delight-gametest.log

      - name: Run Modern Industrialization GameTest server
        run: |
          set -o pipefail
          python3 -c 'import shutil; shutil.rmtree("run/world", ignore_errors=True)'
          ./gradlew runModernIndustrializationGameTestServer --console=plain --no-daemon 2>&1 | tee build/ci-logs/modern-industrialization-gametest.log

      - name: Run Ars Nouveau GameTest server
        run: |
          set -o pipefail
          python3 -c 'import shutil; shutil.rmtree("run/world", ignore_errors=True)'
          ./gradlew runArsNouveauGameTestServer --console=plain --no-daemon 2>&1 | tee build/ci-logs/ars-nouveau-gametest.log

      - name: Run EvilCraft GameTest server
        run: |
          set -o pipefail
          python3 -c 'import shutil; shutil.rmtree("run/world", ignore_errors=True)'
          ./gradlew runEvilCraftGameTestServer --console=plain --no-daemon 2>&1 | tee build/ci-logs/evilcraft-gametest.log

      - name: Run Powah GameTest server
        run: |
          set -o pipefail
          python3 -c 'import shutil; shutil.rmtree("run/world", ignore_errors=True)'
          ./gradlew runPowahGameTestServer --console=plain --no-daemon 2>&1 | tee build/ci-logs/powah-gametest.log

      - name: Run Industrial Foregoing GameTest server
        run: |
          set -o pipefail
          python3 -c 'import shutil; shutil.rmtree("run/world", ignore_errors=True)'
          ./gradlew runIndustrialForegoingGameTestServer --console=plain --no-daemon 2>&1 | tee build/ci-logs/industrial-foregoing-gametest.log

      - name: Run Create GameTest server
        run: |
          set -o pipefail
          python3 -c 'import shutil; shutil.rmtree("run/world", ignore_errors=True)'
          ./gradlew runCreateGameTestServer --console=plain --no-daemon 2>&1 | tee build/ci-logs/create-gametest.log

      - name: Run PneumaticCraft GameTest server
        run: |
          set -o pipefail
          python3 -c 'import shutil; shutil.rmtree("run/world", ignore_errors=True)'
          ./gradlew runPneumaticCraftGameTestServer --console=plain --no-daemon 2>&1 | tee build/ci-logs/pneumaticcraft-gametest.log

      - name: Run Extended Crafting GameTest server
        run: |
          set -o pipefail
          python3 -c 'import shutil; shutil.rmtree("run/world", ignore_errors=True)'
          ./gradlew runExtendedCraftingGameTestServer --console=plain --no-daemon 2>&1 | tee build/ci-logs/extended-crafting-gametest.log

      - name: Run optional compatibility matrix GameTest server
        run: |
          set -o pipefail
          python3 -c 'import shutil; shutil.rmtree("run/world", ignore_errors=True)'
          ./gradlew runCompatibilityMatrixGameTestServer --console=plain --no-daemon 2>&1 | tee build/ci-logs/compatibility-matrix-gametest.log

      - name: Run script tests
        run: |
          set -o pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover scripts 2>&1 | tee build/ci-logs/python-unittest.log

      - name: Check datagen drift
        run: |
          set -o pipefail
          MIN_EMI="$(sed -n 's/^emi_version=//p' gradle.properties)"
          MIN_EMI_RUNTIME="$(python3 scripts/resolve_emi_runtime.py "$MIN_EMI")"
          bash scripts/stage_emi_runtime.sh "$MIN_EMI" "$MIN_EMI_RUNTIME" 2>&1 | tee build/ci-logs/emi-runtime.log
          ./gradlew runData --console=plain --no-daemon 2>&1 | tee build/ci-logs/datagen.log
          if [ -n "$(git status --porcelain -- src/generated/resources src/main/resources)" ]; then
            echo "Datagen changed tracked or generated resources; run ./gradlew runData and commit the result." >&2
            git status --short -- src/generated/resources src/main/resources
            git diff -- src/generated/resources src/main/resources
            exit 1
          fi

      - name: Generate release notes
        run: |
          mkdir -p build
          VERSION="${{ steps.release-meta.outputs.version }}"
          RELEASE_NOTES_FILE="docs/release-notes/${VERSION}.md"
          test -f "$RELEASE_NOTES_FILE"
          TAG_COMMIT="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${TAG_COMMIT}^" 2>/dev/null || true)"
          {
            echo "## Auto Storage ${GITHUB_REF_NAME}"
            echo
            cat "$RELEASE_NOTES_FILE"
            echo
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "Changes since ${PREVIOUS_TAG}:"
              git log --pretty='- %s (%h)' "${PREVIOUS_TAG}..${TAG_COMMIT}"
            else
              echo "Initial release changes:"
              git log --pretty='- %s (%h)' "${TAG_COMMIT}"
            fi
          } > build/release-notes.md

      - name: Upload release logs and reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: auto-storage-release-logs
          path: |
            build/ci-logs/**
            run/logs/**
            run/crash-reports/**
            build/reports/**
            build/release-notes.md
          if-no-files-found: warn
          retention-days: 14

      - name: Publish alpha
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ github.ref_name }}
          github-prerelease: true
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: build/libs/auto_storage-${{ steps.release-meta.outputs.version }}.jar
          name: Auto Storage ${{ steps.release-meta.outputs.version }} Alpha
          version: ${{ steps.release-meta.outputs.version }}
          version-type: alpha
          changelog-file: build/release-notes.md
          loaders: neoforge
          environment: client | server
          game-versions: 1.21.1
          java: 21
          dependencies: |
            emi(required){modrinth:fRiHVvU7}{curseforge:580555}#(ignore:github)
            patchouli(required){modrinth:nU0bVIaL}{curseforge:306770}#(ignore:github)
